<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>7. Изображения, относительные и абсолютные пути</title>
</head>
<body>
  <div class="lazy-cat-image-wrapper">
    <img
      src="images/lazy-cat.jpg"
      alt="Кошка возле деревенского домика"
      width="300" height="300"
      loading="lazy"
    />
  </div>

  <div class="lots-of-cats">
    <img
      src="images/watching-cat.jpg"
      alt="Кошка смотрит в душу через зеркало"
      width="300"
      height="300"
      loading="lazy"
    />
    <img
      src="images/posing-cat.jpg"
      alt="Кошка на подоконнике позирует на камеру"
      width="300"
      height="400"
      loading="lazy"
    />
    <img
      src="images/cozy-cat.jpg"
      alt="Морда кошки крупным планом"
      width="300"
      height="400"
      loading="lazy"
    />
  </div>

</html>
