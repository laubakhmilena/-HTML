<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>12. Формы: вариации тега input</title>
</head>
<body>
  <form action="#" method="post">
    <fieldset>
    <label for="name">Имя:</label>
    <input type="text" id="name" name="name"><br><br>

    <label for="email">Электронная почта:</label>
    <input type="email" id="email" name="user-email"><br><br>

    <label for="phone">Номер телефона:</label>
    <input type="tel" id="phone" name="user-phone"><br><br>

    <label for="gender">Пол:</label>
    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Мужской</label>
    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Женский</label>

    <label for="age">Возраст:</label>
    <input type="number" id="age" name="age"><br><br>

    <lanel for="dob">Дата рождения:</label>
    <input type="fulldate" id="dob" name="dob"><br><br>

    <label for="user-profile">URL-адрес в соцсети:</label>
    <input type ="url" id="user-profile" name="user-profile"><br><br>

    <label foe="color">Любимый цвет:</label>
    <input type="color" id="color" name="color"><br><br>

    <label for="avatar">Аватарка:</label>
    <input type="file" id="avatar" name="avatar"><br><br>

    <button type="submit">Отправить</button>
    </fieldset>
</html>

<!-- - имя
- электронная почта
- номер телефона
- группа радиокнопок с выбором пола
- возраст
- дата рождения
- url-адрес в любой соцсети
- любимый цвет
- аватарка (поле загрузки файла) -->
