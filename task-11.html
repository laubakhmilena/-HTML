<!doctype html>
<html lang="en">

<head>

  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>11. Формы: теги form, fieldset, legend, label, input</title>
</head>

<body>
  <form action="" methed="post">
    <fieldset>
      <!-- <legend>Паспортные данные</legend> -->
      <label for="Passport data">Паспортные данные</label>
      <input id="Passport data" />
    </fieldset>
    <fieldset>
      <!-- <legend>Работа</legend> -->
      <label for="Work">Работа</label>
      <input id="Work" />
    </fieldset>
    <fieldset>
      <!-- <legend>Образование</legend> -->
      <label for="Education">Образование</label>
      <input id="Education" />
    </fieldset>
    <fieldset>
      <!-- <legend>Контакты</legend> -->
      <label for="Contacts">Контакты</label>
      <input id="Contacts" />
    </fieldset>
  </form>
</body>

</html>
